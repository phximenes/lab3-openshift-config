apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agenda-dev
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/lucasmartinssw/lab3-openshift-config.git
    targetRevision: main
    path: overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: lucas-dev-lab-final
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
